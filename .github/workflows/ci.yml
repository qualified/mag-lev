name: CI
on:
  push:
    branches:
      - master
  pull_request:

# Ensures that only one task per branch/environment will run at a time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: "!contains(github.event.head_commit.message, '[ci skip]') && !contains(github.event.head_commit.message, '[skip ci]')"
    name: ruby ${{ matrix.ruby }} / rails ${{ matrix.rails }}
    runs-on: ubuntu-24.04 # ubuntu-latest is 26.04, which has no prebuilt Ruby 3.0/3.1
    # Rails 7.0 still fails the when_change `errors[field] <<` specs (Rails 7
    # frozen errors; separate from QUAL-2684, which fixed Mongoid 8 dirty
    # tracking). Ruby 3.1 fails
    # on YAML.load (Psych 4) in enhanced_serialize.rb until QUAL-2629 lands.
    # Remove each condition when its ticket is done.
    continue-on-error: ${{ matrix.rails == '7.0' || matrix.ruby == '3.1' }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.0', '3.1']
        rails: ['6.1', '7.0']
    env:
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails == '6.1' && '6_1' || '7_0' }}.gemfile
    services:
      redis:
        image: redis:5.0-alpine
        ports:
          - 6379/tcp
      mongo:
        image: mongo:7.0
        ports:
          - 27017/tcp
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
      - name: Show Rails version
        run: |
          bundle exec ruby -e 'require "rails"; puts "Rails #{Rails.version}"'
      - name: RSpec
        run: bundle exec rspec --color --backtrace --format progress
        env:
          REDIS_URL: redis://localhost:${{ job.services.redis.ports[6379] }}
          MONGODB_HOST: localhost:${{ job.services.mongo.ports[27017] }}
